<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Klinikleitstand</title>
<style>
:root{color-scheme:light dark;--bg:#F7F4F2;--fg:#1C2024;--muted:#5E5652;--line:#E6DFDB}
@media (prefers-color-scheme:dark){:root{--bg:#14171A;--fg:#F2EFED;--muted:#A39B96;--line:#2A2F34}}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{padding:32px;text-align:center}
h1{margin:0;font-size:clamp(28px,6vw,48px);font-weight:700;letter-spacing:-.02em}
p{margin:14px 0 0;color:var(--muted);font-size:16px}
hr{width:56px;border:0;border-top:1px solid var(--line);margin:22px auto 0}
</style>
</head>
<body>
<main>
<h1>Klinikleitstand</h1>
<hr>
<p>Diese Seite ist im Aufbau.</p>
</main>
</body>
</html>
